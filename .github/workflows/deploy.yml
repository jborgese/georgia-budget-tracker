# Publishes the static export to Cloudflare Workers, serving
# georgia.frootsnoops.com (config in web/wrangler.jsonc). Two triggers:
# pushes to main that touch the frontend or its data, and completed runs
# of the Data refresh workflow — its bot pushes with the default
# GITHUB_TOKEN, which never fires other workflows' push events, so
# without the workflow_run trigger refreshed data would sit unpublished.
# Requires repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts:Edit
# on the account + DNS:Edit on the frootsnoops.com zone) and
# CLOUDFLARE_ACCOUNT_ID.
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "data/processed/**"
      - ".github/workflows/deploy.yml"
  workflow_run:
    workflows: ["Data refresh"]
    types: [completed]
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
